<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><title>Мой кабинет · Тезаурус</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/assets/site.css"><link rel="stylesheet" href="/assets/katex/katex.min.css">
<style>
.tabs{display:flex;gap:6px;margin:14px 0}.tabs button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:600 15px var(--body);cursor:pointer}.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.field input.plain{text-transform:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media (max-width:700px){.two{grid-template-columns:1fr}}
table.w{width:100%;border-collapse:collapse;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden}table.w th,table.w td{padding:10px 12px;border-bottom:1px solid var(--rule);text-align:left;font-size:15px;vertical-align:top}table.w th{color:var(--ink-2);font-weight:600;font-size:13.5px}
.score{font:700 17px var(--mono)}
.task{border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--sheet)}.task .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.task .head b{font:700 16px var(--mono)}.task .q{margin:4px 0 10px}
.block{border-left:4px solid var(--acc);padding-left:12px;margin:16px 0}.pill{font:600 12.5px var(--body);padding:3px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:16px;margin:8px 0}.chk input{margin-top:5px;width:18px;height:18px}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.photo{max-width:100%;border:1px solid var(--rule);border-radius:8px;margin:6px 0}
details>summary{cursor:pointer;margin:6px 0}.cmt{color:var(--ink-2);font-size:14px}
</style></head><body><main data-page="me"><h1>Мой кабинет</h1><div id="app"><p class="sub">Загружаю…</p></div></main>
