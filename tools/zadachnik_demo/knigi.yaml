# Полка раздела «Задачник» — ДЕМО для проверки страниц (задачи демо-банка написаны хабом, не из книг).
# Настоящий словарь — hub/подтемы.yaml на ПК: все книги банка, параграфы по оглавлениям config/toc-*.json.
#
# podtemy — сквозные подтемы: ключ связи разделов разных книг (слаг = subtopic банка).
# knigi   — порядок = порядок на полке. sources — ключи source.book в банке.
#   closed: true — тексты, рисунки и ответы шифруются; открываются после входа в кабинет (или паролем учителя).
#   level_default — якорь уровня, если у задачи нет level; position_shift — сдвиг ±x по месту в параграфе.
#   parts[].match — первое совпавшее правило: prefix (номер начинается с), range [a, b] (целый номер), subtopic, all.
#   shift — поправка калибровки парами (книга целиком или параграф), добавляется к d.

podtemy:
  относительность-движения: {title: Относительность движения, topic: кинематика, section: механика, classes: [9, 10]}
  движение-по-окружности:   {title: Движение по окружности,   topic: кинематика, section: механика, classes: [9, 10]}

knigi:
  - id: demo
    sources: [demo-zadachnik]
    short: Демо-задачник
    title: Демо-задачник (закрытая книга — проверка замка)
    author: хаб «Метафизики»
    aliases: [демо, демо-задачник]
    classes: [9, 10]
    closed: true
    parts:
      - {id: "1", n: "§ 1", title: Относительность движения, match: {prefix: "1."}, subs: [относительность-движения]}
      - {id: "2", n: "§ 2", title: Движение по окружности,   match: {prefix: "2."}, subs: [движение-по-окружности]}

  - id: mf
    sources: [metaphys]
    short: Метафизика
    title: Задачи «Метафизики» — переписанные и свои
    author: «Метафизика»
    aliases: [мф, метафизика]
    classes: [7, 8, 9, 10, 11]
    closed: false
    parts:
      - {id: okr, n: "", title: Движение по окружности, match: {subtopic: движение-по-окружности}, subs: [движение-по-окружности]}
